# Builds the engine and the referee and checks them (tools/check_all.sh: the
# network of refs/assets/net, the differential test of the engine against the
# referee, perft, the bench signature with the test network, invalid input
# (tests/invalid_input.py), reproducible search (tests/reprosearch.py), the
# network evaluator, which network is loaded (EvalFile, else the embedded one),
# pondering, the referee's library from Python, the local board);
# the trainer on the CPU (tests/train_smoke.py: continuing from a net file, a
# short training, the engine loads the result); a build with AddressSanitizer
# and UndefinedBehaviorSanitizer and the move-generator self-checks
# (JQ_VERIFY_LEGAL: legality and check of every move against a full test; perft,
# searches on one and two threads, random games with reveals and captures of
# face-down pieces and searches along them, invalid input with fuzzing,
# reproducible search, the network evaluator, pondering, the differential test); the universal binary on x86-64 and arm64 with the network
# embedded (tests/universal_smoke.py: every build the runner's CPU runs, perft 1
# to 3, the bench signature, the bench with the embedded network the same in
# every build, the network evaluator; tests/evalfile_smoke.py; invalid input and
# reproducible search); and the Python code (byte
# compilation, fishtest's pages).
# Runs for the branch pro (pushes to it and pull requests into it), when the
# change touches the code, the tools and scripts, the tests or this file. The runner
# image is pinned (not ubuntu-latest), so that a new compiler or sanitizer
# runtime only comes with a deliberate change of this file.
name: CI

on:
  push:
    branches: [pro]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "train/**"
      - "fishtest/**"
      - "scripts/**"
      - "CMakeLists.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [pro]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "train/**"
      - "fishtest/**"
      - "scripts/**"
      - "CMakeLists.txt"
      - ".github/workflows/ci.yml"

jobs:
  check:
    name: Build and check (tools/check_all.sh)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check
        run: JOBS="$(nproc)" NICE= bash tools/check_all.sh
      - name: Logs
        if: failure()
        run: tail -n 40 build/check/logs/*.log

  trainer:
    name: Trainer on the CPU (tests/train_smoke.py)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: PyTorch (CPU)
        run: python -m pip install --quiet numpy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMASKFISH_NATIVE=OFF
          cmake --build build -j"$(nproc)" --target maskfish jqnz_tool
      - name: Train
        run: python tests/train_smoke.py build/maskfish --jqnz build/jqnz_tool --require

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
      - name: Network
        run: sh scripts/net.sh --require
      - name: Build
        run: |
          cmake -S . -B build -DMASKFISH_SANITIZE=ON -DMASKFISH_NATIVE=OFF \
            -DCMAKE_CXX_FLAGS="-march=x86-64-v3 -DJQ_VERIFY_LEGAL"
          cmake --build build -j"$(nproc)" --target maskfish maskfish_difftest
      # Not `bench`: its fourth position is a malformed FEN (17 red pieces) that
      # set_fen leaves half-parsed, and the search of it reads an empty history
      # (a known defect the bench signature rests on). The searches here start
      # from the start position and from a game position, on one thread then two.
      - name: Search, one thread then two
        shell: bash
        run: |
          net="$PWD/nets/maskfish.nnue"
          for threads in 1 2; do
            {
              printf 'setoption name EvalFile value %s\nsetoption name Threads value %s\n' "$net" "$threads"
              printf 'position startpos\ngo depth 9\n'
              sleep 25
              printf 'position startpos moves a3a4P i6i5r h0g2P h9g7a b0c2N c6c5a c3c4P e6e5n\ngo depth 9\n'
              sleep 25
              echo quit
            } | build/maskfish > search.log 2>&1 || { cat search.log; exit 1; }
            ! grep -E "runtime error|AddressSanitizer" search.log
            [ "$(grep -c bestmove search.log)" = 2 ] || { cat search.log; exit 1; }
            grep bestmove search.log
          done
      - name: Perft (JQ_VERIFY_LEGAL checks every move)
        run: |
          out=$(printf 'position startpos\nperft 4\nquit\n' | build/maskfish 2>&1)
          echo "$out" | grep '^perft'
          echo "$out" | grep -q '^perft 4 3636111 '
      - name: Random games (reveals, captures of face-down pieces, searches)
        run: python3 tests/random_games.py build/maskfish --games 12 --nodes 20000 --seed "${{ github.run_number }}"
      - name: Invalid input (with fuzzing)
        run: python3 tests/invalid_input.py build/maskfish --fuzz 20000 --seed "${{ github.run_number }}"
      - name: Reproducible search
        run: python3 tests/reprosearch.py build/maskfish --evalfile "$PWD/nets/maskfish.nnue" --steps 12
      - name: Network evaluator
        run: python3 tests/hnn_smoke.py build/maskfish
      - name: Pondering
        run: python3 tests/ponder_smoke.py build/maskfish "$PWD/nets/maskfish.nnue"
      - name: Differential test
        run: build/maskfish_difftest 200 "${{ github.run_number }}"

  universal:
    name: Universal binary (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Network (embedded in the binary)
        run: sh scripts/net.sh --require
      - name: Build
        run: |
          cmake -S . -B build -DMASKFISH_UNIVERSAL=ON -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build build -j"$(nproc)" --target maskfish maskfish_difftest
      - name: Every build this CPU runs
        run: python3 tests/universal_smoke.py build/maskfish
      - name: Which network is loaded
        run: python3 tests/evalfile_smoke.py build/maskfish --net nets/maskfish.nnue
      - name: Invalid input
        run: python3 tests/invalid_input.py build/maskfish
      - name: Reproducible search
        run: python3 tests/reprosearch.py build/maskfish
      - name: Differential test (baseline core)
        run: build/maskfish_difftest 200 "${{ github.run_number }}"

  python:
    name: Python code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Byte-compile
        run: python -m py_compile tools/*.py train/*.py tests/*.py fishtest/*.py tools/jieqi/*.py scripts/*.py
      - name: Shell syntax
        run: for f in scripts/*.sh tools/*.sh; do bash -n "$f" || exit 1; done
      - name: Fishtest pages
        run: |
          python -m pip install --quiet -r fishtest/requirements.txt
          python fishtest/stats.py > /dev/null
          python fishtest/fishtest.py --no-runner --data "$RUNNER_TEMP/ft" --port 6543 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:6543/tests > /dev/null && break; sleep 1; done
          for page in /tests /tests/run /nets /settings; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:6543$page")
            echo "$page $code"
            [ "$code" = 200 ] || exit 1
          done
